<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Solitaire Neeltje - De Werkende Versie</title>
    <style>
        :root {
            --card-w: 85px;
            --card-h: 125px;
            --anim-speed: 0.8s;
            --bezier: cubic-bezier(0.4, 0, 0.2, 1);
            --bg: #070b14;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); margin: 0; overflow: hidden; font-family: sans-serif; touch-action: none; }

        #board {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, #1a2d66 0%, #070b14 100%);
            perspective: 1500px;
        }

        /* De Kaart Container */
        .card {
            position: absolute;
            width: var(--card-w); height: var(--card-h);
            transition: left var(--anim-speed) var(--bezier), top var(--anim-speed) var(--bezier);
            z-index: 10;
        }

        /* Tijdens slepen geen animatie-vertraging */
        .card.dragging {
            transition: none !important;
            z-index: 1000 !important;
            transform: scale(1.05);
        }

        /* 3D Draai-effect */
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform var(--anim-speed) var(--bezier);
        }

        .card.dn .card-inner { transform: rotateY(180deg); }
        .card.up .card-inner { transform: rotateY(0deg); }

        .card-face {
            position: absolute; inset: 0;
            backface-visibility: hidden;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        .card-front { background: #fff; color: #000; border: 1px solid #ddd; }
        .card-back { 
            background: linear-gradient(135deg, #1e40af, #1e3a8a); 
            border: 3px solid #fff; transform: rotateY(180deg); 
        }

        .card-content { padding: 10px; font-weight: bold; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="board"></div>

<script>
    const board = document.getElementById('board');
    let dragTarget = null;
    let offset = { x: 0, y: 0 };

    function createCard(rank, suit, x, y, isUp = false) {
        const card = document.createElement('div');
        card.className = `card ${isUp ? 'up' : 'dn'}`;
        card.style.left = x + 'px';
        card.style.top = y + 'px';
        
        const isRed = suit === '♥' || suit === '♦';
        card.innerHTML = `
            <div class="card-inner">
                <div class="card-face card-front">
                    <div class="card-content" style="color: ${isRed ? 'red' : 'black'}">
                        ${rank}<br>${suit}
                    </div>
                </div>
                <div class="card-face card-back"></div>
            </div>`;

        card.onpointerdown = startDrag;
        board.appendChild(card);
        return card;
    }

    function startDrag(e) {
        if (this.classList.contains('dn')) return;
        dragTarget = this;
        dragTarget.classList.add('dragging');
        const rect = dragTarget.getBoundingClientRect();
        offset.x = e.clientX - rect.left;
        offset.y = e.clientY - rect.top;
        dragTarget.setPointerCapture(e.pointerId);
    }

    window.onpointermove = (e) => {
        if (!dragTarget) return;
        dragTarget.style.left = (e.clientX - offset.x) + 'px';
        dragTarget.style.top = (e.clientY - offset.y) + 'px';
    };

    window.onpointerup = () => {
        if (!dragTarget) return;
        dragTarget.classList.remove('dragging');
        dragTarget = null;
    };

    function safeFlip(cardEl) {
        cardEl.offsetHeight; // Forceer browser om startpunt te onthouden
        requestAnimationFrame(() => {
            cardEl.classList.replace('dn', 'up');
        });
    }

    // Start-voorbeeld: Kaart trekken
    const kaart = createCard('K', '♥', 50, 50, false);
    setTimeout(() => {
        kaart.style.left = '200px';
        safeFlip(kaart);
    }, 1000);
</script>
</body>
</html>
