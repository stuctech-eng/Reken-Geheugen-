<style>
    :root {
        --anim-speed: 0.6s;
        --bezier: cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    /* Het speelveld */
    #board {
        position: relative;
        width: 100%; height: 100vh;
        perspective: 1500px;
        touch-action: none; /* Cruciaal voor slepen op mobiel */
    }

    /* De Kaart */
    .card {
        position: absolute;
        width: 90px; height: 130px;
        transition: left var(--anim-speed) var(--bezier), top var(--anim-speed) var(--bezier);
        z-index: 10;
        cursor: grab;
    }

    .card.dragging {
        transition: none !important; /* Geen vertraging tijdens het slepen zelf */
        z-index: 1000 !important;
        transform: scale(1.05); /* Licht optillen tijdens slepen */
    }

    .card-inner {
        position: relative;
        width: 100%; height: 100%;
        transform-style: preserve-3d;
        transition: transform var(--anim-speed) var(--bezier);
    }

    /* Flip States */
    .card.dn .card-inner { transform: rotateY(180deg); }
    .card.up .card-inner { transform: rotateY(0deg); }

    .card-face {
        position: absolute; inset: 0;
        backface-visibility: hidden;
        border-radius: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .card-front { background: white; color: black; }
    .card-back { 
        background: linear-gradient(135deg, #1e40af, #1e3a8a); 
        border: 2px solid #fff; 
        transform: rotateY(180deg); 
    }
</style>

<script>
    // SLEEP LOGICA (DRAG & DROP)
    let dragTarget = null;
    let offset = { x: 0, y: 0 };

    function makeDraggable(el) {
        el.onpointerdown = (e) => {
            // Alleen open kaarten slepen
            if (el.classList.contains('dn')) return;

            dragTarget = el;
            el.classList.add('dragging');
            
            // Bereken waar de vinger de kaart raakt
            const rect = el.getBoundingClientRect();
            offset.x = e.clientX - rect.left;
            offset.y = e.clientY - rect.top;

            el.setPointerCapture(e.pointerId);
        };

        el.onpointermove = (e) => {
            if (!dragTarget) return;
            // Volg de vinger/muis direct
            dragTarget.style.left = (e.clientX - offset.x) + 'px';
            dragTarget.style.top = (e.clientY - offset.y) + 'px';
        };

        el.onpointerup = (e) => {
            if (!dragTarget) return;
            dragTarget.classList.remove('dragging');
            // Hier komt de logica om te checken of de kaart op een stapel ligt
            dragTarget = null;
        };
    }

    // ANIMATIE LOGICA (VOOR HET OMDRAAIEN)
    function flipCard(cardEl) {
        cardEl.offsetHeight; // Forceer browser-check
        requestAnimationFrame(() => {
            cardEl.classList.replace('dn', 'up');
        });
    }
</script>
